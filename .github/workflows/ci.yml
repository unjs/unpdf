name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@24
          cache: true
      - run: pnpm run build:pdfjs
      - run: pnpm run build
      - run: pnpm run test:attw
      - run: pnpm run test:types
      - run: pnpm run test:types:dist
      - run: pnpm run lint
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

  test:
    name: test (${{ matrix.runtime }})
    needs: build
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Node.js 24
            node-version: 24
            command: pnpm exec vitest run --project node
          - runtime: Node.js 26
            node-version: 26
            command: pnpm exec vitest run --project node
          - runtime: Node.js 24 on Windows
            os: windows-latest
            node-version: 24
            command: pnpm exec vitest run --project node
          - runtime: Bun
            node-version: 24
            command: bun --bun vitest run --project node
          - runtime: Cloudflare Workers
            node-version: 24
            command: pnpm exec vitest run --project workerd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.runtime == 'Bun'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: ${{ matrix.command }}
